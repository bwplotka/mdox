version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Sorted alphabetically.
    - errcheck
    - forbidigo
    - goconst
    - godot
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unparam
    - unused

  settings:
    errcheck:
      exclude-functions:
        - (github.com/go-kit/log.Logger).Log
        - fmt.Fprintln
        - fmt.Fprint
    forbidigo:
      # Keep the print restrictions previously checked by faillint.
      forbid:
        - pattern: '^fmt\.(Print|Printf|Println)$'
      analyze-types: true
    goconst:
      min-occurrences: 5
    misspell:
      locale: US
    staticcheck:
      # Preserve the checks previously provided by staticcheck and gosimple.
      checks:
        - SA*
        - S*

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - forbidigo
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
